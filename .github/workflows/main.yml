name: Build PhysX 4.1 Android arm64 (Ubuntu 20.04 Container)

on:
  workflow_dispatch:
    inputs:
      build_config:
        description: 'PhysX 编译配置'
        required: true
        default: 'checked'
        type: choice
        options:
          - debug     # 无优化 + 断言 + 完整符号 (-O0 -g)
          - checked   # 适度优化 + API检查 + 符号
          - profile   # 高性能 + PVD分析 + 强制附加符号 (-g)
          - release   # 最高性能 + 强制附加符号 (-g)
      lib_type:
        description: '输出库类型'
        required: true
        default: 'static'
        type: choice
        options:
          - static    # 静态库 (.a)
          - shared    # 动态库 (.so)

jobs:
  build-android:
    runs-on: ubuntu-22.04
    # 直接在原生 Ubuntu 20.04 容器中执行所有步骤（兼容 PhysX 4.1 时代的工具链）
    container:
      image: ubuntu:20.04

    steps:
      - name: Install Base Dependencies in Ubuntu 20.04
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl unzip git build-essential \
            cmake ninja-build python3 python-is-python3
          cmake --version
          python --version

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download & Setup Android NDK r21e
        run: |
          curl -sSL https://google.com -o ndk.zip
          unzip -q ndk.zip -d /opt
          rm -f ndk.zip
          echo "ANDROID_NDK_ROOT=/opt/android-ndk-r21e" >> $GITHUB_ENV
          echo "NDK_ROOT=/opt/android-ndk-r21e" >> $GITHUB_ENV
          echo "ANDROID_NDK=/opt/android-ndk-r21e" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=/opt/android-ndk-r21e" >> $GITHUB_ENV

      - name: Configure Preset & Generate PhysX Projects
        env:
          LIB_TYPE: ${{ github.event.inputs.lib_type || 'static' }}
        run: |
          set -e
          cd physx

          if [ -f "buildtools/presets/public/android-arm64-v8a.xml" ]; then
            PRESET_NAME="android-arm64-v8a"
          else
            PRESET_NAME="android"
            sed -i 's/armeabi-v7a/arm64-v8a/g' buildtools/presets/public/android.xml
          fi

          PRESET_FILE="buildtools/presets/public/${PRESET_NAME}.xml"
          if [ "$LIB_TYPE" = "shared" ]; then
            sed -i 's/PX_GENERATE_STATIC_LIBRARIES" value="True"/PX_GENERATE_STATIC_LIBRARIES" value="False"/g' "$PRESET_FILE"
          else
            sed -i 's/PX_GENERATE_STATIC_LIBRARIES" value="False"/PX_GENERATE_STATIC_LIBRARIES" value="True"/g' "$PRESET_FILE"
          fi

          echo "PRESET_NAME=$PRESET_NAME" >> $GITHUB_ENV
          chmod +x generate_projects.sh
          ./generate_projects.sh "$PRESET_NAME"

          echo "=== Generated compiler directories ==="
          find compiler -maxdepth 3 -type d

      - name: Compile with Debug Symbols
        env:
          CONFIG: ${{ github.event.inputs.build_config || 'checked' }}
        run: |
          set -e
          BUILD_DIR=$(find physx/compiler -maxdepth 3 -type d -iname "${PRESET_NAME}*${CONFIG}" | head -n 1)

          if [ -z "$BUILD_DIR" ] || [ ! -d "$BUILD_DIR" ]; then
            echo "Error: Could not find build directory for preset '${PRESET_NAME}' and config '${CONFIG}'."
            find physx/compiler -maxdepth 3 -type d || true
            exit 1
          fi

          echo "Building in: $BUILD_DIR"

          if [ "$CONFIG" = "release" ] || [ "$CONFIG" = "profile" ]; then
            cmake -B "$BUILD_DIR" \
              -DCMAKE_C_FLAGS_RELEASE="-O3 -g -DNDEBUG" \
              -DCMAKE_CXX_FLAGS_RELEASE="-O3 -g -DNDEBUG" \
              -DCMAKE_C_FLAGS_PROFILE="-O3 -g -DNDEBUG" \
              -DCMAKE_CXX_FLAGS_PROFILE="-O3 -g -DNDEBUG"
          fi

          cmake --build "$BUILD_DIR" -j$(nproc)

      - name: Verify Output & Debug Symbols
        run: |
          set -e
          LIBS=$(find physx/bin/ -type f \( -name "*.a" -o -name "*.so" \))
          if [ -z "$LIBS" ]; then
            echo "Error: No .a or .so files found in physx/bin/!"
            exit 1
          fi
          echo "$LIBS"

          FIRST_LIB=$(echo "$LIBS" | head -n 1)
          /opt/android-ndk-r21e/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf -S "$FIRST_LIB" | grep -E "debug_info|debug_line"

      - name: Upload Build Artifacts (Libraries & Headers)
        uses: actions/upload-artifact@v4
        with:
          name: physx-4.1-android-arm64-${{ github.event.inputs.build_config || 'checked' }}-${{ github.event.inputs.lib_type || 'static' }}-symbols
          path: |
            physx/bin/
            physx/include/
            pxshared/include/
