name: Build PhysX 4.1 Android arm64 (With Symbols)

on:
  workflow_dispatch: # 支持在 GitHub Actions 页面手动触发
    inputs:
      build_config:
        description: 'PhysX Build Configuration'
        required: true
        default: 'checked'
        type: choice
        options:
          - debug     # 无优化 + 断言 + 完整符号 (-O0 -g)
          - checked   # 适度优化 + API检查 + 符号
          - profile   # 高性能 + PVD性能分析 + 强制附加符号 (-g)
          - release   # 最高性能 + 强制附加符号 (-g)

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Android NDK (r21e)
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e
          add-to-path: true

      - name: Setup Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3

      - name: Detect Preset & Generate PhysX Projects
        env:
          # 覆盖 PhysX 4.1 构建脚本可能读取的所有 NDK 环境变量
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -e
          echo "Resolved NDK Path: $ANDROID_NDK_ROOT"
          ls -la physx/buildtools/presets/public/

          cd physx
          # 自动判断仓库中是否存在 android-arm64-v8a.xml，否则回退并修改 android.xml
          if [ -f "buildtools/presets/public/android-arm64-v8a.xml" ]; then
            PRESET_NAME="android-arm64-v8a"
          else
            PRESET_NAME="android"
            # 确保旧版 android.xml 目标架构为 arm64-v8a
            sed -i 's/armeabi-v7a/arm64-v8a/g' buildtools/presets/public/android.xml
          fi

          echo "Using preset: $PRESET_NAME"
          echo "PRESET_NAME=$PRESET_NAME" >> $GITHUB_ENV
          ./generate_projects.sh "$PRESET_NAME"

          echo "Generated compiler directories:"
          ls -la compiler/

      - name: Compile with Debug Symbols
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
          CONFIG: ${{ github.event.inputs.build_config || 'checked' }}
        run: |
          set -e
          # 动态查找对应 preset 和 config 的编译目录（兼容带 .clang 或其他后缀的目录名）
          BUILD_DIR=$(find physx/compiler -maxdepth 1 -type d -name "${PRESET_NAME}*${CONFIG}" | head -n 1)

          if [ -z "$BUILD_DIR" ] || [ ! -d "$BUILD_DIR" ]; then
            echo "Error: Could not find build directory for preset '${PRESET_NAME}' and config '${CONFIG}'."
            echo "Available directories in physx/compiler/:"
            ls -la physx/compiler/ || true
            exit 1
          fi

          echo "Building in directory: $BUILD_DIR"

          # 若选择 profile 或 release，向 CMake 缓存强制注入 -g 以保留完整调试符号
          if [ "$CONFIG" = "release" ] || [ "$CONFIG" = "profile" ]; then
            cmake -B "$BUILD_DIR" \
              -DCMAKE_C_FLAGS_RELEASE="-O3 -g -DNDEBUG" \
              -DCMAKE_CXX_FLAGS_RELEASE="-O3 -g -DNDEBUG" \
              -DCMAKE_C_FLAGS_PROFILE="-O3 -g -DNDEBUG" \
              -DCMAKE_CXX_FLAGS_PROFILE="-O3 -g -DNDEBUG"
          fi

          # 执行多线程编译（不执行 install/strip，防止剥离 DWARF 调试符号）
          cmake --build "$BUILD_DIR" -j$(nproc)

      - name: Verify Debug Symbols in Output
        env:
          NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          echo "Compiled libraries:"
          find physx/bin/ -type f \( -name "*.a" -o -name "*.so" \)

          FIRST_LIB=$(find physx/bin/ -type f \( -name "*.a" -o -name "*.so" \) | head -n 1)
          if [ -n "$FIRST_LIB" ]; then
            echo "Checking DWARF debug sections in: $FIRST_LIB"
            "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -S "$FIRST_LIB" | grep debug
          else
            echo "Warning: No .a or .so files found in physx/bin/"
            exit 1
          fi

      - name: Upload Build Artifacts (Libraries & Headers)
        uses: actions/upload-artifact@v4
        with:
          name: physx-4.1-android-arm64-${{ github.event.inputs.build_config || 'checked' }}-symbols
          path: |
            physx/bin/
            physx/include/
            pxshared/include/
