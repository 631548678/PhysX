name: Build PhysX 4.1 Android arm64 (Windows Host)

on:
  workflow_dispatch:
    inputs:
      build_config:
        description: 'PhysX 编译配置'
        required: true
        default: 'checked'
        type: choice
        options:
          - debug     # 无优化 + 断言 + 完整符号 (-O0 -g)
          - checked   # 适度优化 + API检查 + 符号
          - profile   # 高性能 + PVD分析 + 强制附加符号 (-g)
          - release   # 最高性能 + 强制附加符号 (-g)
      lib_type:
        description: '输出库类型'
        required: true
        default: 'static'
        type: choice
        options:
          - static    # 静态库 (.a)
          - shared    # 动态库 (.so)

jobs:
  build-android:
    runs-on: windows-2022

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Android NDK (r21e)
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e
          add-to-path: true

      - name: Setup Compatible CMake (3.19.8) & Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.19.8

      - name: Configure Preset & Generate PhysX Projects
        shell: pwsh
        env:
          RAW_NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
          LIB_TYPE: ${{ github.event.inputs.lib_type || 'static' }}
        run: |
          $ErrorActionPreference = "Stop"
          # 将反斜杠转为正斜杠，防止 CMake 解析路径转义出错，并导出 PhysX 专属的 PM_AndroidNDK_PATH
          $ndkPath = $env:RAW_NDK_PATH -replace '\\', '/'
          $env:PM_AndroidNDK_PATH = $ndkPath
          $env:ANDROID_NDK_ROOT = $ndkPath
          $env:NDK_ROOT = $ndkPath

          "PM_AndroidNDK_PATH=$ndkPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ANDROID_NDK_ROOT=$ndkPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "PM_AndroidNDK_PATH: $env:PM_AndroidNDK_PATH"
          cmake --version

          Set-Location physx

          if (Test-Path "buildtools/presets/public/android-arm64-v8a.xml") {
            $presetName = "android-arm64-v8a"
          } elseif (Test-Path "buildtools/presets/public/android.xml") {
            $presetName = "android"
            (Get-Content "buildtools/presets/public/android.xml") -replace 'armeabi-v7a', 'arm64-v8a' | Set-Content "buildtools/presets/public/android.xml"
          } else {
            Write-Error "No android preset found in buildtools/presets/public/"
          }

          $presetFile = "buildtools/presets/public/$presetName.xml"
          $content = Get-Content $presetFile -Raw
          if ($env:LIB_TYPE -eq "shared") {
            $content = $content -replace 'PX_GENERATE_STATIC_LIBRARIES" value="True"', 'PX_GENERATE_STATIC_LIBRARIES" value="False"'
          } else {
            $content = $content -replace 'PX_GENERATE_STATIC_LIBRARIES" value="False"', 'PX_GENERATE_STATIC_LIBRARIES" value="True"'
          }
          Set-Content -Path $presetFile -Value $content

          "PRESET_NAME=$presetName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          # 传入换行符避免批处理脚本异常时卡在 pause
          cmd /c "echo. | generate_projects.bat $presetName"
          if ($LASTEXITCODE -ne 0) { throw "generate_projects.bat failed with exit code $LASTEXITCODE" }

          Write-Host "=== Generated compiler directories ==="
          Get-ChildItem -Path "compiler" -Recurse -Directory -Depth 2 | Select-Object FullName

      - name: Compile with Debug Symbols
        shell: pwsh
        env:
          CONFIG: ${{ github.event.inputs.build_config || 'checked' }}
        run: |
          $ErrorActionPreference = "Stop"
          $buildDir = Get-ChildItem -Path "physx/compiler" -Recurse -Directory -Depth 2 |
            Where-Object { $_.Name -like "$($env:PRESET_NAME)*$($env:CONFIG)" } |
            Select-Object -First 1 -ExpandProperty FullName

          if (-not $buildDir) {
            Write-Error "Could not find build directory for preset '$($env:PRESET_NAME)' and config '$($env:CONFIG)'."
          }

          Write-Host "Building in: $buildDir"

          if ($env:CONFIG -eq "release" -or $env:CONFIG -eq "profile") {
            cmake -B "$buildDir" `
              -DCMAKE_C_FLAGS_RELEASE="-O3 -g -DNDEBUG" `
              -DCMAKE_CXX_FLAGS_RELEASE="-O3 -g -DNDEBUG" `
              -DCMAKE_C_FLAGS_PROFILE="-O3 -g -DNDEBUG" `
              -DCMAKE_CXX_FLAGS_PROFILE="-O3 -g -DNDEBUG"
          }

          cmake --build "$buildDir" --parallel
          if ($LASTEXITCODE -ne 0) { throw "CMake build failed with exit code $LASTEXITCODE" }

      - name: Verify Output & Debug Symbols
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $libs = Get-ChildItem -Path "physx/bin" -Recurse -File -Include *.a, *.so
          if (-not $libs) {
            Write-Error "No .a or .so files found in physx/bin!"
          }
          $libs | ForEach-Object { Write-Host $_.FullName }

          $readelf = Get-ChildItem -Path $env:PM_AndroidNDK_PATH -Recurse -File -Include llvm-readelf.exe, aarch64-linux-android-readelf.exe | Select-Object -First 1 -ExpandProperty FullName
          $firstLib = $libs | Select-Object -First 1 -ExpandProperty FullName

          if ($readelf -and $firstLib) {
            Write-Host "=== Checking DWARF debug sections in: $firstLib ==="
            & $readelf -S "$firstLib" | Select-String -Pattern "debug_info|debug_line"
          }

      - name: Upload Build Artifacts (Libraries & Headers)
        uses: actions/upload-artifact@v4
        with:
          name: physx-4.1-android-arm64-${{ github.event.inputs.build_config || 'checked' }}-${{ github.event.inputs.lib_type || 'static' }}-symbols
          path: |
            physx/bin/
            physx/include/
            pxshared/include/
